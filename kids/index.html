<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아침 리딩">
<title>아침 리딩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<script src="./scene.js"></script>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2a33;--sub:#7b7686;--en:#2f7de1;--ko:#ff7a45;--ok:#2fb26b;--line:#f0e6d6;--shadow:0 6px 0 rgba(0,0,0,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',-apple-system,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{font-family:'Jua';font-size:28px;margin:0;flex:1}
.stars{font-family:'Jua';font-size:20px;background:#fff;border-radius:99px;padding:6px 14px;box-shadow:var(--shadow)}
.back{text-decoration:none;color:var(--ink);font-family:'Jua';font-size:18px;background:#fff;border-radius:99px;padding:8px 14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.day{background:var(--card);border-radius:22px;padding:10px;box-shadow:var(--shadow);text-align:left}
.day .d{font-family:'Jua';font-size:15px;color:var(--sub);margin:8px 4px 2px}
.day .t{font-family:'Jua';font-size:17px;margin:0 4px}
.day .t.en{color:var(--en);font-family:'Baloo 2';font-weight:700}
.day .t.ko{color:var(--ko)}
.today{position:absolute}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tab{font-family:'Jua';font-size:22px;padding:14px;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.tab.on.en{background:var(--en);color:#fff}.tab.on.ko{background:var(--ko);color:#fff}
.book{background:var(--card);border-radius:28px;padding:12px;box-shadow:var(--shadow)}
.title{font-family:'Jua';font-size:26px;text-align:center;margin:6px 0 2px}
.title small{display:block;font-size:15px;color:var(--sub);font-family:'Gowun Dodum'}
.txt{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 8px 6px}
.txt .main{font-size:32px;line-height:1.35;word-break:keep-all}
.en .txt .main{font-family:'Baloo 2';font-weight:700}
.ko .txt .main{font-family:'Jua';font-size:30px}
.txt .sub{color:var(--sub);font-size:17px;margin-top:6px}
.w{border-radius:8px;padding:0 2px;transition:background .15s}
.w.hi{background:#ffe066}
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 4px}
.big{width:64px;height:64px;border-radius:50%;background:#f4efe6;font-size:28px;display:flex;align-items:center;justify-content:center}
.big.play{width:84px;height:84px;font-size:38px;color:#fff}
.en .big.play{background:var(--en)}.ko .big.play{background:var(--ko)}
.big:disabled{opacity:.3}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#e7dfd2}.dots i.on{background:#ffb703}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pill{font-family:'Jua';font-size:15px;padding:8px 14px;border-radius:99px;background:#f4efe6}
.pill.on{background:#ffd166}
.it{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{margin-top:-1.2%}}
h2{font-family:'Jua';font-size:24px;margin:26px 4px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border-radius:22px;padding:14px 8px;box-shadow:var(--shadow);text-align:center}
.card .e{font-size:64px;line-height:1.1}
.card .wd{font-family:'Baloo 2';font-weight:700;font-size:26px;color:var(--en)}
.ko .card .wd{font-family:'Jua';color:var(--ko)}
.card .m{font-size:15px;color:var(--sub);min-height:20px}
.panel{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);font-size:18px;line-height:1.6}
.chant{font-family:'Baloo 2';font-weight:700;font-size:24px;text-align:center}
.q{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.q .qt{font-family:'Jua';font-size:21px}
.q .qk{color:var(--sub);font-size:16px}
.q .lv{font-size:13px;font-family:'Jua';background:#eef6ff;color:var(--en);border-radius:99px;padding:2px 8px;margin-right:6px}
.ch{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.ch button{flex:1;min-width:90px;font-size:22px;word-break:keep-all;padding:12px;border-radius:18px;background:#f4efe6;font-family:'Jua'}
.ko .ch{flex-direction:column}.ko .ch button{font-size:20px;text-align:left;padding:12px 16px}
.ch button.ok{background:var(--ok);color:#fff}.ch button.no{background:#ffd6d6;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dict{display:flex;gap:10px;flex-wrap:wrap}
.dict button{font-family:'Jua';font-size:22px;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);min-width:96px}
.copy{font-family:'Jua';font-size:28px;letter-spacing:4px;border:3px dashed #ffcfb4;border-radius:16px;padding:14px;text-align:center;color:#c9b8ad}
.burst{position:fixed;pointer-events:none;font-size:42px;z-index:9;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.tip{font-size:15px;color:var(--sub);background:#fff3d6;border-radius:16px;padding:12px 14px;margin-top:20px;line-height:1.6}
.plan{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;margin:0 0 12px}.plan span{background:#fff;border-radius:99px;padding:4px 10px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.photo{margin:6px 0 10px;position:relative}.photo img{width:100%;border-radius:20px;display:block;max-height:440px;object-fit:cover}
.photo .real{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-family:'Jua';font-size:14px;border-radius:99px;padding:3px 10px}
.photo figcaption{font-size:15px;text-align:center;margin-top:6px;line-height:1.4}.photo small{color:var(--sub);font-size:11px}.photo a{color:var(--sub)}
.hook{background:#fff3d6;border-radius:14px;padding:8px 12px;margin:6px 4px 10px;font-size:16px;text-align:center}
.org{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.org .st{text-align:center;font-family:'Jua';font-size:16px;min-width:64px}.org .st .e{font-size:44px}.org .ar{font-size:22px;color:#ffb703}
.empty{text-align:center;color:var(--sub);padding:40px}
@media (max-width:420px){.txt .main{font-size:27px}.ko .txt .main{font-size:25px}.big.play{width:72px;height:72px}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">불러오는 중…</p></div>
<script>
document.head.insertAdjacentHTML('beforeend', `<style>${KidsScene.SCENE_CSS}</style>`);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
let INDEX = [], L = null, lang = 'en', page = 0, rate = store.get('rate', 0.8), auto = store.get('auto', true);

/* ---------- 소리 (기기 내장 음성) ---------- */
const synth = window.speechSynthesis;
function voice(l) {
  const vs = synth ? synth.getVoices() : [];
  const pref = l === 'en' ? ['Samantha', 'Google US English', 'Microsoft Aria', 'Karen'] : ['Yuna', 'Google 한국의', 'Microsoft SunHi', 'Sora'];
  const code = l === 'en' ? 'en' : 'ko';
  return pref.map(p => vs.find(v => v.name.includes(p))).find(Boolean) || vs.find(v => v.lang.replace('_', '-').startsWith(code + '-US')) || vs.find(v => v.lang.startsWith(code));
}
if (synth) synth.onvoiceschanged = () => {};
function speak(text, l, el) {
  return new Promise(res => {
    if (!synth) return res();
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[🌰-🫶]/gu, ''));
    u.lang = l === 'en' ? 'en-US' : 'ko-KR'; u.rate = rate; const v = voice(l); if (v) u.voice = v;
    const ws = el ? [...el.querySelectorAll('.w')] : [];
    u.onboundary = e => { if (!ws.length) return; ws.forEach(w => w.classList.toggle('hi', +w.dataset.s <= e.charIndex && e.charIndex < +w.dataset.e)); };
    u.onend = u.onerror = () => { ws.forEach(w => w.classList.remove('hi')); res(); };
    synth.speak(u);
  });
}
function words(t) { let i = 0; return t.split(/(\s+)/).map(p => { const s = i; i += p.length; return /\s/.test(p) ? p : `<span class="w" data-s="${s}" data-e="${i}">${esc(p)}</span>`; }).join(''); }

/* ---------- 별 ---------- */
function stars() { return Object.values(store.get('stars', {})).reduce((a, b) => a + b, 0); }
function addStar(key, x, y) {
  const s = store.get('stars', {}); if (s[key]) return; s[key] = 1; store.set('stars', s);
  for (let i = 0; i < 8; i++) { const b = document.createElement('span'); b.className = 'burst'; b.textContent = ['⭐', '🌟', '✨'][i % 3];
    b.style.left = x + 'px'; b.style.top = y + 'px'; const a = i / 8 * 6.28; b.style.setProperty('--dx', Math.cos(a) * 110 + 'px'); b.style.setProperty('--dy', Math.sin(a) * 110 + 'px');
    document.body.appendChild(b); setTimeout(() => b.remove(), 1000); }
  const st = $('.stars'); if (st) st.textContent = '⭐ ' + stars();
}

/* ---------- 화면 ---------- */
let CAL = null;
async function load() {
  INDEX = await fetch('./lessons/index.json', { cache: 'no-store' }).then(r => r.json()).catch(() => []);
  CAL = await fetch('./calendar.json', { cache: 'no-store' }).then(r => r.json()).catch(() => null);
  route();
}
window.onhashchange = route;
async function route() {
  synth && synth.cancel();
  const m = location.hash.match(/^#(\d{4}-\d\d-\d\d)(?:\/(en|ko))?/);
  if (!m) return home();
  L = await fetch(`./lessons/${m[1]}.json`, { cache: 'no-store' }).then(r => r.json()).catch(() => null);
  if (!L) return home();
  lang = m[2] || 'en'; page = 0; lesson(); scrollTo(0, 0);
}
function home() {
  const list = [...INDEX].sort((a, b) => b.date.localeCompare(a.date));
  $('#app').innerHTML = `<div class="top"><h1>🌞 아침 리딩</h1><span class="stars">⭐ ${stars()}</span></div>
  ${list.length ? `<div class="grid">${list.map((d, i) => `<a href="#${d.date}" style="text-decoration:none;color:inherit"><div class="day">
    ${d.photo ? `<img src="./${esc(d.photo)}" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:22px;display:block">` : KidsScene.sceneHTML(d.cover)}<div class="d">${i === 0 ? '🆕 오늘 · ' : ''}DAY ${d.day} · ${d.date.slice(5).replace('-', '/')} (${d.weekday})</div>
    <div class="t en">${esc(d.en_title)}</div><div class="t ko">${esc(d.ko_title)}</div></div></a>`).join('')}</div>` : '<p class="empty">아직 지문이 없어요.</p>'}
  ${calHTML(list[0] && list[0].date)}
  <p class="tip">⏱ 하루 20분: <b>English 10분</b>(듣기 → 따라 읽기 → 단어 → 문제) + <b>국어 10분</b>(듣기 → 소리 내어 읽기 → 낱말 → 문제·받아쓰기).<br>🔊 소리는 기기에 들어 있는 음성으로 읽어 줘요. 아이패드·아이폰은 무음 스위치를 꺼 주세요.</p>`;
}
function calHTML(last) {
  if (!CAL) return '';
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const next = CAL.days.filter(x => !last || x.date > last).slice(0, 7);
  if (!next.length) return '';
  return `<h2>📅 다음 주제 미리 보기</h2><div class="panel" style="font-size:15px">${next.map(x => `<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)"><b style="font-family:'Jua';min-width:72px">${x.date.slice(5).replace('-', '/')} (${WD[new Date(x.date + 'T12:00:00Z').getUTCDay()]})</b><div>🔤 ${esc(x.en)}<br>📖 ${esc(x.ko)}</div></div>`).join('')}</div>`;
}
function lesson() {
  const B = L[lang], P = B.pages;
  const isEn = lang === 'en';
  const pg = P[page];
  $('#app').innerHTML = `<div class="top"><a href="#" class="back">← 목록</a><h1 style="font-size:20px;text-align:center">DAY ${L.day}</h1><span class="stars">⭐ ${stars()}</span></div>
  <div class="tabs"><button class="tab en ${isEn ? 'on' : ''}" data-l="en">🔤 English</button><button class="tab ko ${!isEn ? 'on' : ''}" data-l="ko">📖 국어</button></div>
  <div class="${lang}">
  <div class="plan">⏱ <b>오늘의 10분</b> ${(isEn ? ['🎧 듣기 2분', '🗣 따라 읽기 3분', '🃏 단어 2분', '⭐ 문제 3분'] : ['🎧 듣기 2분', '📢 소리 내어 읽기 3분', '🃏 낱말 2분', '⭐ 문제·받아쓰기 3분']).map(t => `<span>${t}</span>`).join('')}</div>
  <div class="book">
    <div class="title">${esc(B.title)}<small>${esc(isEn ? B.title_ko : B.theme)}</small></div>
    ${B.photo ? `<figure class="photo"><img src="./${esc(B.photo.src)}" alt="${esc(B.photo.caption_ko)}"><span class="real">📷 진짜 사진</span><figcaption>${isEn && B.photo.caption ? `<b>${esc(B.photo.caption)}</b><br>` : ''}${esc(B.photo.caption_ko)}<small> · 📷 <a href="${esc(B.photo.page)}" target="_blank" rel="noopener">${esc(B.photo.credit)}</a>, ${esc(B.photo.license)}</small></figcaption></figure>` : ''}
    ${B.hook_ko ? `<div class="hook">${esc(B.hook_ko)}</div>` : ''}
    <div id="pic">${KidsScene.sceneHTML(pg.scene)}</div>
    <div class="txt"><div class="main" id="say">${words(isEn ? pg.en : pg.text)}</div>${isEn ? `<div class="sub">${esc(pg.ko)}</div>` : ''}</div>
    <div class="dots">${P.map((_, i) => `<i class="${i === page ? 'on' : ''}"></i>`).join('')}</div>
    <div class="ctrl"><button class="big" id="prev" ${page === 0 ? 'disabled' : ''}>◀</button><button class="big play" id="play">🔊</button><button class="big" id="next">${page === P.length - 1 ? '🏁' : '▶'}</button></div>
    <div class="opts"><button class="pill ${rate < 0.8 ? 'on' : ''}" data-r="0.6">🐢 천천히</button><button class="pill ${rate >= 0.8 ? 'on' : ''}" data-r="0.85">🐰 보통</button><button class="pill ${auto ? 'on' : ''}" id="auto">자동 읽기 ${auto ? 'ON' : 'OFF'}</button><button class="pill" id="all">▶ 처음부터 다 듣기</button></div>
  </div>
  ${isEn ? enExtras(B) : koExtras(B)}
  <div class="tip">👪 ${esc(B.parent_tip_ko)}<br><span style="font-size:13px">${esc(B.source_note)}</span></div>
  </div>`;
  bind();
}
function card(w, l) { return `<button class="card" data-say="${esc(w.word)}" data-l="${l}"><div class="e">${w.emoji}</div><div class="wd">${esc(w.word)}</div><div class="m">${esc(w.ko || w.meaning)}</div></button>`; }
function quiz(B, l) {
  return `<h2>⭐ ${l === 'en' ? 'Check' : '확인 문제'}</h2>${B.quiz.map((q, i) => `<div class="q"><div class="qt">${q.level || q.type ? `<span class="lv">${esc(q.level || q.type)}</span>` : ''}${esc(q.q)} ${l === 'en' ? `<button class="sayq" data-say="${esc(q.q)}">🔊</button>` : ''}</div>${q.q_ko ? `<div class="qk">${esc(q.q_ko)}</div>` : ''}
    <div class="ch">${q.choices.map((c, j) => `<button data-q="${l}-${i}" data-j="${j}" data-a="${q.answer}">${esc(c)}</button>`).join('')}</div></div>`).join('')}`;
}
function org(o) { return `<h2>🧩 한눈에 정리: ${esc(o.title)}</h2><div class="org">${o.steps.map(([e, t], i) => `${i ? '<span class="ar">➜</span>' : ''}<div class="st"><div class="e">${e}</div><div>${esc(t)}</div></div>`).join('')}</div>`; }
function enExtras(B) {
  return `<h2>🃏 Words <small style="font-size:15px;color:var(--sub)">눌러서 들어요</small></h2><div class="cards">${B.words.map(w => card(w, 'en')).join('')}</div>
  ${org(B.organizer)}
  ${quiz(B, 'en')}
  <h2>🗣 Talk</h2><div class="panel" style="font-family:'Baloo 2';font-weight:700;font-size:20px">${esc(B.talk_en)} <button data-say="${esc(B.talk_en.split('→')[0])}" data-l="en">🔊</button></div>`;
}
function koExtras(B) {
  return `<h2>🃏 새 낱말</h2><div class="cards">${B.words.map(w => card(w, 'ko')).join('')}</div>
  <h2>🐾 흉내 내는 말</h2><div class="cards">${B.sound_words.map(w => card(w, 'ko')).join('')}</div>
  ${org(B.organizer)}
  ${quiz(B, 'ko')}
  <h2>✏️ 받아쓰기 <small style="font-size:15px;color:var(--sub)">듣고 쓴 뒤, 눌러서 정답 확인</small></h2>
  <div class="dict">${B.dictation.map((w, i) => `<button data-d="${esc(w)}">🔊 ${i + 1}번</button>`).join('')}</div>
  <h2>💬 이야기 나누기</h2><div class="panel">${esc(B.talk)}</div>
  <h2>✍️ 따라 쓰기</h2><div class="copy">${esc(B.copy_sentence)}</div>
  <h2>🖍 그림 그리기</h2><div class="panel">${esc(B.draw)}</div>`;
}
function bind() {
  const B = L[lang], P = B.pages;
  const read = () => speak(lang === 'en' ? P[page].en : P[page].text, lang, $('#say'));
  const go = d => { page = Math.max(0, Math.min(P.length - 1, page + d)); lesson(); if (auto) read(); };
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { location.hash = `${L.date}/${b.dataset.l}`; });
  $('#play').onclick = read;
  $('#prev').onclick = () => go(-1);
  $('#next').onclick = e => { if (page === P.length - 1) { addStar(`${L.date}-${lang}-book`, e.clientX, e.clientY); $('#app').querySelector('h2')?.scrollIntoView({ behavior: 'smooth' }); } else go(1); };
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; store.set('rate', rate); lesson(); });
  $('#auto').onclick = () => { auto = !auto; store.set('auto', auto); lesson(); };
  $('#all').onclick = async () => { for (let i = 0; i < P.length; i++) { page = i; lesson(); await read(); await new Promise(r => setTimeout(r, 500)); if (!location.hash.includes(L.date)) break; } };
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say, b.dataset.l || 'en'));
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = e => {
    const ok = +b.dataset.j === +b.dataset.a;
    b.classList.remove('no'); void b.offsetWidth; b.classList.add(ok ? 'ok' : 'no');
    speak(ok ? (lang === 'en' ? 'Great job!' : '딩동댕! 잘했어요!') : (lang === 'en' ? 'Try again!' : '다시 해 볼까?'), lang);
    if (ok) addStar(`${L.date}-q-${b.dataset.q}`, e.clientX, e.clientY);
  });
  document.querySelectorAll('[data-d]').forEach(b => { let n = 0; b.onclick = () => { n++; if (n === 1) speak(b.dataset.d, 'ko'); else { b.textContent = b.dataset.d; b.style.background = '#e9fbe9'; } }; });
  let sx = null; const bk = $('.book');
  bk.addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
  bk.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); sx = null; });
}
load();
</script>
</body>
</html>
